<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard RT</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6ef;--card:#fff;--ink:#1d2a24;--mute:#66736c;--line:#dde2d6;--pri:#1f5c43;--pri-ink:#fff;--warn:#b3402e;--warnbg:#f8e4df;--ok:#2d7a50;--okbg:#e0f0e6;--amber:#f0b429;--side:#17392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b17;--card:#1d2722;--ink:#e8eee9;--mute:#93a39a;--line:#2f3d36;--pri:#4aa77b;--pri-ink:#0d1712;--side:#0f1a15;--warn:#f08a75;--warnbg:#3a2621;--ok:#6fcf9b;--okbg:#1f3529}}
:root[data-theme="dark"]{--bg:#141b17;--card:#1d2722;--ink:#e8eee9;--mute:#93a39a;--line:#2f3d36;--pri:#4aa77b;--pri-ink:#0d1712;--side:#0f1a15;--warn:#f08a75;--warnbg:#3a2621;--ok:#6fcf9b;--okbg:#1f3529}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
header{background:transparent;color:var(--ink);padding:26px 16px 0}
.wrap{max-width:980px;margin:0 auto}
h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--mute);margin:2px 0 0}
body{padding-left:240px}
aside{position:fixed;left:0;top:0;bottom:0;width:240px;z-index:5;background:var(--side);color:#fff;display:flex;flex-direction:column;overflow-y:auto;padding:calc(22px + env(safe-area-inset-top,0px)) 12px 16px}
.brand{padding:0 8px 20px}.brand b{display:block;font-size:22px;font-weight:800;line-height:1.15;letter-spacing:.01em}.brand small{opacity:.75;font-size:12px}
nav{display:flex;flex-direction:column;gap:4px}
nav button{border:0;background:transparent;color:#e8eee9;padding:11px 14px;font:600 14px inherit;font-family:inherit;cursor:pointer;border-radius:10px;text-align:left;white-space:nowrap}
nav button:hover{background:rgba(255,255,255,.08)}
nav button[aria-selected=true]{background:rgba(255,255,255,.18);color:#fff}
.tools{display:flex;flex-direction:column;gap:2px;margin-top:18px}
.tools .tl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;padding:0 14px 6px}
.tools button{border:0;background:transparent;color:#e8eee9;padding:9px 14px;font:600 13px inherit;font-family:inherit;cursor:pointer;border-radius:10px;text-align:left}
.tools button:hover{background:rgba(255,255,255,.08)}
.sfoot{margin-top:auto;padding:16px 8px 0;font-size:12px;opacity:.85}
.sfoot .btn{color:#fff;border-color:rgba(255,255,255,.35);margin-top:6px;display:block}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
#today{color:var(--mute);font-size:14px;text-align:right}
@media(max-width:720px){body{padding-left:0}aside{position:static;width:auto;padding:14px 12px}.brand{padding-bottom:10px}nav,.tools{flex-direction:row;overflow-x:auto}.tools .tl{display:none}.tools{margin-top:6px}.tools button{white-space:nowrap}.sfoot{padding-top:8px}.hd{flex-direction:column}#today{text-align:left}}
main{padding:20px 16px 60px}
h2{font-size:18px;margin:0 0 12px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.btn{background:var(--pri);color:var(--pri-ink);border:0;border-radius:8px;padding:8px 14px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.del{color:var(--warn);background:transparent;border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{color:var(--mute);font-size:13px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.rem{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line)}
.rem:first-of-type{border-top:0}
.rem small{color:var(--mute);display:block}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--okbg);color:var(--ok);white-space:nowrap}
.tag.p{background:var(--amber);color:#3a2a00}
.tag.w{background:var(--warnbg);color:var(--warn)}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mute);font-weight:600}
tr:last-child td{border-bottom:0}
td.act{white-space:nowrap;text-align:right}
.empty{padding:20px;color:var(--mute);text-align:center}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(420px,92vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 3px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.dlgbtn{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
body.ro [data-add],body.ro [data-edit],body.ro [data-del],body.ro #imp,body.ro [data-done],body.ro [data-lunas]{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<aside><div class="brand"><b>🏘️ RT<br>DASHBOARD</b><small>Administrasi RT Digital</small></div><nav role="tablist" id="nav"></nav><div class="tools"><div class="tl">Laporan</div>
<button id="pdfw">📄 PDF untuk warga</button><button id="pdf">📑 PDF lengkap (pengurus)</button></div>
<div class="sfoot" id="mode"></div></aside>
<header><div class="wrap hd"><div><h1 id="ptitle">Beranda</h1><p class="sub">Sistem administrasi RT yang sederhana dan mudah digunakan</p></div><span id="today"></span></div></header>
<main><div class="wrap"><div id="view"></div></div></main>

<div id="login" style="display:none;position:fixed;inset:0;z-index:9;background:var(--bg);align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:20px"><h1 style="color:var(--ink)">Dashboard RT</h1><p style="color:var(--mute);margin:0">Khusus pengurus. Masuk dengan akun Google yang sudah didaftarkan.</p><button class="btn" id="gin">Masuk dengan Google</button><p id="lmsg" style="color:var(--warn);font-weight:600;margin:0"></p></div>
<dialog id="dlg"><form method="dialog" id="frm"><h2 id="dtitle"></h2><div id="dfields"></div>
<div class="dlgbtn"><button type="button" class="btn ghost" id="cancel">Batal</button><button type="submit" class="btn">Simpan</button></div></form></dialog>

<dialog id="idlg"><h2>Impor cadangan</h2><p id="iinfo"></p>
<label style="font-weight:400"><input type="radio" name="mode" value="gabung" checked style="width:auto"> <b>Gabung</b>: data di file ditambahkan, data yang sama ditimpa, data lain tetap ada</label>
<label style="font-weight:400"><input type="radio" name="mode" value="ganti" style="width:auto"> <b>Ganti semua</b>: hapus data sekarang, isi persis seperti file</label>
<p id="iwarn" style="color:var(--warn);font-weight:600"></p>
<div class="dlgbtn"><button type="button" class="btn ghost" id="icancel">Batal</button><button type="button" class="btn" id="iok">Impor</button></div></dialog>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
const KEY='dashboard-rt-v1';
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const now=new Date(), TODAY=iso(now);
const plus=n=>{const d=new Date(now);d.setDate(d.getDate()+n);return iso(d)};
const rp=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
const fd=s=>s?new Date(s+'T00:00:00').toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short',year:'numeric'}):'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const diff=s=>Math.round((new Date(s+'T00:00:00')-new Date(TODAY+'T00:00:00'))/864e5);
const rel=n=>n===0?'Hari ini':n===1?'Besok':n<0?Math.abs(n)+' hari lalu':'H-'+n;
const bln=TODAY.slice(0,7);

const T={
 iuran:{label:'Iuran',title:'Iuran warga',f:[
  {k:'nama',l:'Nama warga'},{k:'jenis',l:'Jenis iuran',t:'select',o:['Keamanan','Sampah','Kas RT','Lainnya']},
  {k:'bulan',l:'Bulan',t:'month'},{k:'nominal',l:'Nominal (Rp)',t:'number'},{k:'status',l:'Status',t:'select',o:['Belum','Lunas']}]},
 kas:{label:'Kas',title:'Buku kas RT',f:[
  {k:'tgl',l:'Tanggal',t:'date'},{k:'ket',l:'Keterangan'},{k:'tipe',l:'Jenis',t:'select',o:['Masuk','Keluar']},{k:'nominal',l:'Nominal (Rp)',t:'number'}]},
 ronda:{label:'Ronda',title:'Jadwal ronda',f:[
  {k:'tgl',l:'Tanggal',t:'date'},{k:'nama',l:'Petugas (pisahkan koma)'},{k:'cat',l:'Catatan'}]},
 agenda:{label:'Agenda',title:'Agenda kegiatan',f:[
  {k:'tgl',l:'Tanggal',t:'date'},{k:'judul',l:'Kegiatan'},{k:'lokasi',l:'Lokasi / jam'}]},
 lapor:{label:'Pengaduan',title:'Laporan pengaduan warga',f:[
  {k:'tgl',l:'Tanggal'.replace('Tanggal','Tanggal'),t:'date'},{k:'pelapor',l:'Pelapor (inisial / blok)'},{k:'judul',l:'Masalah'},{k:'lokasi',l:'Lokasi'},
  {k:'status',l:'Status',t:'select',o:['Baru','Diproses','Selesai']}]},
 info:{label:'Pengumuman',title:'Pengumuman',f:[
  {k:'tgl',l:'Tanggal',t:'date'},{k:'judul',l:'Judul'},{k:'isi',l:'Isi',t:'textarea'}]}
};
const ORDER=['home','iuran','kas','lapor','ronda','agenda','info','cadangan'];

let S={iuran:[],kas:[],ronda:[],agenda:[],lapor:[],info:[]},db=null,canW=true;
const LK='dashboard-rt-v2';
try{const x=JSON.parse(localStorage.getItem(LK));if(x&&x.iuran)S=x}catch(e){}
Object.keys(T).forEach(k=>S[k]=S[k]||[]);
const lsSave=()=>{try{localStorage.setItem(LK,JSON.stringify(S))}catch(e){}};
const fail=e=>alert('Gagal menyimpan: '+((e&&(e.message||e.code))||'coba lagi'));
const store={
 async set(k,id,o){
  if(db){const c=db.collection(k);await(id?c.doc(id):c.doc()).set(o)}
  else{if(id)Object.assign(S[k].find(x=>x.id==id),o);else S[k].push({id:'l'+Date.now(),...o});lsSave();render()}},
 async patch(k,id,o){
  if(db)await db.collection(k).doc(id).update(o);
  else{Object.assign(S[k].find(x=>x.id==id),o);lsSave();render()}},
 async del(k,id){
  if(db)await db.collection(k).doc(id).delete();
  else{S[k]=S[k].filter(x=>x.id!=id);lsSave();render()}}
};
const firebaseConfig={apiKey:"ISI_DARI_FIREBASE",authDomain:"ISI_DARI_FIREBASE",projectId:"ISI_DARI_FIREBASE",appId:"ISI_DARI_FIREBASE"};
let unsubs=[];
function showLogin(on,msg){const l=document.getElementById('login');l.style.display=on?'flex':'none';document.getElementById('lmsg').textContent=msg||''}
async function init(){
 const m=document.getElementById('mode');
 if(firebaseConfig.apiKey.startsWith('ISI')){m.textContent='mode lokal (konfigurasi Firebase belum diisi)';return}
 firebase.initializeApp(firebaseConfig);
 firebase.auth().onAuthStateChanged(u=>{
  unsubs.forEach(f=>f());unsubs=[];
  if(!u){db=null;showLogin(true);m.textContent='belum masuk';return}
  showLogin(false);db=firebase.firestore();
  m.innerHTML=''+esc(u.email)+' · data tersimpan online <button class="btn ghost sm" id="out">Keluar</button>';
  Object.keys(T).forEach(k=>unsubs.push(db.collection(k).onSnapshot(sn=>{S[k]=sn.docs.map(d=>({id:d.id,...d.data()}));render()},e=>{
   if(e.code==='permission-denied'){db=null;showLogin(true,'Akun '+u.email+' tidak punya akses. Masuk dengan akun lain.');firebase.auth().signOut()}
   else m.textContent='gagal memuat data: '+(e.code||'coba muat ulang')})));
 });
}
document.addEventListener('click',e=>{
 if(e.target.id==='gin')firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(fail);
 if(e.target.id==='out')firebase.auth().signOut();
});

let tab='home';
const IC={home:'🏠',iuran:'💰',kas:'📒',lapor:'📣',ronda:'🛡️',agenda:'📅',info:'📢',cadangan:'💾'};
function nav(){document.getElementById('nav').innerHTML=ORDER.map(k=>`<button role="tab" data-tab="${k}" aria-selected="${k===tab}"><span aria-hidden="true">${IC[k]}</span> ${k==='home'?'Beranda':k==='cadangan'?'Cadangan':T[k].label}</button>`).join('')}
function cell(k,v,r){
 if(k==='nominal')return rp(v);
 if(k==='tgl')return fd(v);
 if(k==='bulan')return v?new Date(v+'-01T00:00:00').toLocaleDateString('id-ID',{month:'long',year:'numeric'}):'';
 if(k==='status')return `<span class="tag ${v==='Belum'||v==='Baru'?'w':v==='Diproses'?'p':''}">${esc(v)}</span>`;
 if(k==='tipe')return `<span class="tag ${v==='Keluar'?'w':''}">${esc(v)}</span>`;
 return esc(v);
}
function home(){
 const belum=S.iuran.filter(r=>r.status==='Belum');
 const saldo=S.kas.reduce((a,r)=>a+(r.tipe==='Masuk'?1:-1)*Number(r.nominal||0),0);
 const up=[...S.agenda.map(r=>({...r,src:'agenda',t:r.judul,s:r.lokasi})),...S.ronda.map(r=>({...r,src:'ronda',t:'Ronda: '+r.nama,s:r.cat}))]
  .filter(r=>{const d=diff(r.tgl);return d>=0&&d<=14}).sort((a,b)=>a.tgl.localeCompare(b.tgl));
 const buka=S.lapor.filter(r=>r.status!=='Selesai').sort((a,b)=>a.tgl.localeCompare(b.tgl));
 const info=[...S.info].sort((a,b)=>b.tgl.localeCompare(a.tgl))[0];
 return `<div class="stats">
  <div class="stat"><b>${rp(saldo)}</b><span>Saldo kas</span></div>
  <div class="stat"><b>${belum.length}</b><span>Iuran belum dibayar</span></div>
  <div class="stat"><b>${rp(belum.reduce((a,r)=>a+Number(r.nominal||0),0))}</b><span>Total tunggakan</span></div>
  <div class="stat"><b>${up.length}</b><span>Kegiatan 14 hari ke depan</span></div>
  <div class="stat"><b>${buka.length}</b><span>Pengaduan belum selesai</span></div></div>
 <div class="cols">
  <section class="panel"><h2>Perlu ditagih</h2>${belum.length?belum.map(r=>`<div class="rem"><div>${esc(r.nama)}<small>${esc(r.jenis)} · ${cell('bulan',r.bulan)} · ${rp(r.nominal)}</small></div><button class="btn sm" data-lunas="${r.id}">Tandai lunas</button></div>`).join(''):'<div class="empty">Semua iuran sudah lunas.</div>'}</section>
  <section class="panel"><h2>Pengingat kegiatan</h2>${up.length?up.map(r=>`<div class="rem"><div>${esc(r.t)}<small>${fd(r.tgl)}${r.s?' · '+esc(r.s):''}</small></div><span class="tag ${diff(r.tgl)<=1?'w':''}">${rel(diff(r.tgl))}</span></div>`).join(''):'<div class="empty">Tidak ada agenda atau ronda dalam 14 hari ke depan.</div>'}</section>
  <section class="panel"><h2>Pengaduan belum selesai</h2>${buka.length?buka.map(r=>`<div class="rem"><div>${esc(r.judul)}<small>${esc(r.lokasi)} · ${fd(r.tgl)} · ${esc(r.pelapor)}</small></div><div>${cell('status',r.status)} <button class="btn sm" data-done="${r.id}">Selesai</button></div></div>`).join(''):'<div class="empty">Tidak ada pengaduan yang menunggu.</div>'}</section>
 </div>
 ${info?`<section class="panel" style="margin-top:16px"><h2>Pengumuman terbaru</h2><b>${esc(info.judul)}</b><small style="color:var(--mute)"> ${fd(info.tgl)}</small><p style="margin:6px 0 0">${esc(info.isi)}</p></section>`:''}`;
}
function list(k){
 const c=T[k], rows=S[k];
 const sorted=[...rows].sort((a,b)=>c.f[0].k==='tgl'?b.tgl.localeCompare(a.tgl):0);
 const cols=c.f.filter(f=>f.k!=='isi'||true);
 return `<div class="bar"><h2 style="margin:0">${c.title}</h2><button class="btn" data-add="${k}">+ Tambah</button></div>
 <div class="tbl">${rows.length?`<table><thead><tr>${cols.map(f=>`<th>${f.l}</th>`).join('')}<th></th></tr></thead><tbody>${sorted.map(r=>`<tr>${cols.map(f=>`<td>${cell(f.k,r[f.k],r)}</td>`).join('')}<td class="act">${k==='lapor'&&r.status!=='Selesai'?`<button class="btn sm" data-done="${r.id}">Selesai</button> `:''}${k==='iuran'&&r.status==='Belum'?`<button class="btn sm" data-lunas="${r.id}">Lunas</button> `:''}<button class="btn ghost sm" data-edit="${k}:${r.id}">Edit</button> <button class="btn del sm" data-del="${k}:${r.id}">Hapus</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Belum ada data. Klik Tambah untuk mulai.</div>'}</div>
 ${k==='kas'?`<p style="color:var(--mute)">Saldo: <b style="color:var(--ink)">${rp(rows.reduce((a,r)=>a+(r.tipe==='Masuk'?1:-1)*Number(r.nominal||0),0))}</b></p>`:''}`;
}
function backupPage(){
 const box='background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px';
 return `<section class="panel"><h2>💾 Cadangan &amp; Pulihkan Data</h2>
 <div style="${box}"><b>Kenapa fitur ini penting?</b><br>Data dashboard disimpan di database online, tapi tetap sebaiknya punya salinan sendiri. Unduh cadangan secara rutin (misalnya tiap akhir bulan) dan simpan di laptop atau Google Drive. File ini juga dipakai untuk memindahkan data dari versi lama.</div></section>
 <div class="cols" style="margin-top:16px">
  <section class="panel"><h2>⬇️ Unduh Cadangan</h2><p style="color:var(--mute);margin:0 0 12px">Menyimpan seluruh data dashboard menjadi file <b>.json</b>.</p><button class="btn" id="exp">Unduh Cadangan</button></section>
  <section class="panel"><h2>⬆️ Pulihkan Data</h2><p style="color:var(--mute);margin:0 0 12px">Pilih file cadangan JSON dari perangkat lain atau versi lama.</p>
   <div style="border:1px dashed var(--line);border-radius:8px;padding:10px;margin-bottom:12px"><input type="file" id="fil" accept=".json,application/json" style="border:0;padding:0;background:transparent"></div>
   <button class="btn" id="imp">Pulihkan Data</button></section>
 </div>
 <section class="panel" style="margin-top:16px"><h2>🔄 Alur Pindah Data</h2>
  <p style="margin:0 0 6px"><b>Sumber lama:</b> Cadangan → Unduh Cadangan → simpan file JSON.</p>
  <p style="margin:0 0 6px"><b>Tujuan baru:</b> buka dashboard → Cadangan → pilih file JSON → Pulihkan Data.</p>
  <p style="margin:0;color:var(--mute)">Saat memulihkan, Anda bisa memilih Gabung (data lama tetap ada) atau Ganti semua. Setelah selesai, iuran, kas, ronda, agenda, pengaduan, dan pengumuman muncul kembali.</p></section>`;
}
function render(){nav();document.getElementById('ptitle').textContent=tab==='home'?'Beranda':tab==='cadangan'?'Cadangan / Pulihkan Data':T[tab].title;
 if(tab==='cadangan'&&document.getElementById('fil'))return;
 document.getElementById('view').innerHTML=tab==='home'?home():tab==='cadangan'?backupPage():list(tab)}

const dlg=document.getElementById('dlg');let cur=null;
function openForm(k,id){
 const c=T[k], r=id?S[k].find(x=>x.id==id):{tgl:TODAY,bulan:bln,status:'Belum',tipe:'Masuk'};
 cur={k,id};
 document.getElementById('dtitle').textContent=(id?'Edit ':'Tambah ')+c.label.toLowerCase();
 document.getElementById('dfields').innerHTML=c.f.map(f=>{
  const v=esc(r[f.k]??'');
  const inp=f.t==='select'?`<select name="${f.k}">${f.o.map(o=>`<option${o===r[f.k]?' selected':''}>${o}</option>`).join('')}</select>`
   :f.t==='textarea'?`<textarea name="${f.k}" rows="3">${v}</textarea>`
   :`<input name="${f.k}" type="${f.t||'text'}" value="${v}" required>`;
  return `<label>${f.l}</label>${inp}`}).join('');
 dlg.showModal();
}
document.getElementById('cancel').onclick=()=>dlg.close();
document.getElementById('frm').onsubmit=e=>{
 const f=new FormData(e.target),o={};
 T[cur.k].f.forEach(x=>o[x.k]=x.t==='number'?Number(f.get(x.k)):f.get(x.k));
 store.set(cur.k,cur.id,o).catch(fail);
};
async function exportData(){
 const o=JSON.stringify({app:'dashboard-rt',v:1,at:new Date().toISOString(),data:S},null,1),fn='data-rt-'+TODAY+'.json';
 let dl=null;
 try{dl=window.claude?await claude.use('downloads'):null}catch(e){}
 if(dl){try{await dl.save({filename:fn,data:o})}catch(e){}return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([o],{type:'application/json'}));a.download=fn;a.click();
}
async function exportPdf(){
 const J=window.jspdf;
 if(!J||!J.jsPDF){alert('Pustaka PDF gagal dimuat. Cek koneksi internet, lalu muat ulang halaman.');return}
 const doc=new J.jsPDF(),plain=(k,v)=>['nominal','tgl','bulan'].includes(k)?cell(k,v):String(v??'');
 const belum=S.iuran.filter(r=>r.status==='Belum'),saldo=S.kas.reduce((a,r)=>a+(r.tipe==='Masuk'?1:-1)*Number(r.nominal||0),0);
 doc.setFontSize(16);doc.text('Laporan RT',14,16);
 doc.setFontSize(10);doc.text('Dicetak '+fd(TODAY),14,22);
 doc.text('Saldo kas: '+rp(saldo)+'   |   Iuran belum dibayar: '+belum.length+' ('+rp(belum.reduce((a,r)=>a+Number(r.nominal||0),0))+')   |   Pengaduan belum selesai: '+S.lapor.filter(r=>r.status!=='Selesai').length,14,28);
 let y=38;
 for(const k of ['iuran','kas','lapor','ronda','agenda','info']){
  const c=T[k];
  if(y>245){doc.addPage();y=16}
  doc.setFontSize(12);doc.text(c.title,14,y);
  doc.autoTable({startY:y+3,head:[c.f.map(f=>f.l)],body:S[k].length?S[k].map(r=>c.f.map(f=>plain(f.k,r[f.k]))):[['Belum ada data']],styles:{fontSize:9},headStyles:{fillColor:[31,92,67]}});
  y=doc.lastAutoTable.finalY+12;
 }
 await savePdf(doc,'laporan-rt-'+TODAY+'.pdf');
}
async function savePdf(doc,fn){
 let dl=null;
 try{dl=window.claude?await claude.use('downloads'):null}catch(e){}
 if(dl){try{await dl.save({filename:fn,data:doc.output('arraybuffer')})}catch(e){}return}
 doc.save(fn);
}
async function exportPdfWarga(){
 const J=window.jspdf;
 if(!J||!J.jsPDF){alert('Pustaka PDF gagal dimuat. Cek koneksi internet, lalu muat ulang halaman.');return}
 const doc=new J.jsPDF(),desc=(a,b)=>String(b.tgl||'').localeCompare(String(a.tgl||''));
 const saldo=S.kas.reduce((a,r)=>a+(r.tipe==='Masuk'?1:-1)*Number(r.nominal||0),0);
 doc.setFontSize(18);doc.text('Info RT',14,16);
 doc.setFontSize(10);doc.text('Per '+fd(TODAY),14,22);
 doc.setFontSize(12);doc.text('Saldo kas RT: '+rp(saldo),14,30);
 let y=40;
 const sec=(title,head,rows,note)=>{
  if(y>235){doc.addPage();y=16}
  doc.setFontSize(12);doc.text(title,14,y);
  if(note){doc.setFontSize(8);doc.text(note,14,y+4.5)}
  doc.autoTable({startY:y+(note?7:3),head:[head],body:rows.length?rows:[['Belum ada data']],styles:{fontSize:9},headStyles:{fillColor:[31,92,67]}});
  y=doc.lastAutoTable.finalY+12;
 };
 const jn={};
 S.iuran.filter(r=>r.bulan===bln).forEach(r=>{const o=jn[r.jenis]||(jn[r.jenis]={s:0,b:0,t:0});if(r.status==='Lunas'){o.s++;o.t+=Number(r.nominal||0)}else o.b++});
 sec('Iuran bulan ini',['Jenis iuran','Sudah bayar','Belum bayar','Terkumpul'],Object.entries(jn).map(([k,o])=>[k,o.s+' warga',o.b+' warga',rp(o.t)]),'Nama warga tidak ditampilkan.');
 sec('Kas terbaru',['Tanggal','Keterangan','Masuk','Keluar'],[...S.kas].sort(desc).slice(0,10).map(r=>[fd(r.tgl),r.ket,r.tipe==='Masuk'?rp(r.nominal):'',r.tipe==='Keluar'?rp(r.nominal):'']));
 sec('Agenda kegiatan',['Tanggal','Kegiatan','Lokasi / jam'],S.agenda.filter(r=>diff(r.tgl)>=0).sort((a,b)=>a.tgl.localeCompare(b.tgl)).map(r=>[fd(r.tgl),r.judul,r.lokasi||'']));
 sec('Jadwal ronda 14 hari ke depan',['Tanggal','Petugas','Catatan'],S.ronda.filter(r=>diff(r.tgl)>=0&&diff(r.tgl)<=14).sort((a,b)=>a.tgl.localeCompare(b.tgl)).map(r=>[fd(r.tgl),r.nama,r.cat||'']));
 sec('Pengaduan warga',['Tanggal','Masalah','Lokasi','Status'],[...S.lapor].sort(desc).slice(0,10).map(r=>[fd(r.tgl),r.judul,r.lokasi||'',r.status]),'Nama pelapor tidak ditampilkan.');
 sec('Pengumuman',['Tanggal','Judul','Isi'],[...S.info].sort(desc).slice(0,5).map(r=>[fd(r.tgl),r.judul,r.isi||'']));
 await savePdf(doc,'info-rt-'+TODAY+'.pdf');
}
let pend=null;
const total=()=>Object.keys(T).reduce((a,k)=>a+S[k].length,0);
async function importData(file){
 try{
  const j=JSON.parse(await file.text());
  if(j.app!=='dashboard-rt'||!j.data)throw{message:'File bukan hasil ekspor dashboard ini'};
  pend=j;
  const tgl=j.at?new Date(j.at).toLocaleString('id-ID',{dateStyle:'long',timeStyle:'short'}):'tidak tercatat';
  document.getElementById('iinfo').innerHTML='Cadangan tanggal <b>'+esc(tgl)+'</b>.<br>Isi file: '+Object.keys(T).map(k=>T[k].label.toLowerCase()+' '+(j.data[k]||[]).length).join(', ')+'.<br>Data di dashboard sekarang: '+total()+' data.';
  document.querySelector('#idlg input[value=gabung]').checked=true;
  document.getElementById('iwarn').textContent='';
  document.getElementById('idlg').showModal();
 }catch(e){fail(e)}
}
async function runImport(){
 const j=pend,ganti=document.querySelector('#idlg input[name=mode]:checked').value==='ganti';
 document.getElementById('idlg').close();
 try{
  let n=0;
  for(const k of Object.keys(T)){
   const rows=j.data[k]||[],ids=new Set(rows.map(r=>String(r.id)));
   if(ganti){if(db){for(const r of S[k])if(!ids.has(String(r.id)))await db.collection(k).doc(String(r.id)).delete()}else S[k]=[]}
   for(const r of rows){
    const {id,...o}=r;
    if(db)await db.collection(k).doc(String(id)).set(o);
    else{const i=S[k].findIndex(x=>x.id==id);if(i>=0)S[k][i]={id,...o};else S[k].push({id,...o})}
    n++;
   }
  }
  if(!db){lsSave();render()}
  alert(n+' data berhasil diimpor'+(ganti?' (mode ganti semua).':'.'));
 }catch(e){fail(e)}
}
document.getElementById('icancel').onclick=()=>document.getElementById('idlg').close();
document.getElementById('iok').onclick=runImport;
document.addEventListener('change',e=>{if(e.target.name==='mode'&&e.target.closest('#idlg'))document.getElementById('iwarn').textContent=e.target.value==='ganti'?'Perhatian: '+total()+' data yang ada sekarang akan dihapus dan diganti isi file.':''});
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 const d=b.dataset;
 if(b.id==='pdfw')exportPdfWarga();
 else if(b.id==='pdf')exportPdf();
 else if(b.id==='exp')exportData();
 else if(b.id==='imp'){const f=document.getElementById('fil');if(f&&f.files[0]){importData(f.files[0]);f.value=''}else alert('Pilih file cadangan (.json) dulu.')}
 else if(d.tab){tab=d.tab;render()}
 else if(d.add)openForm(d.add);
 else if(d.edit){const[k,id]=d.edit.split(':');openForm(k,id)}
 else if(d.del){const[k,id]=d.del.split(':');if(confirm('Hapus data ini?'))store.del(k,id).catch(fail)}
 else if(d.done)store.patch('lapor',d.done,{status:'Selesai'}).catch(fail);
 else if(d.lunas)store.patch('iuran',d.lunas,{status:'Lunas'}).catch(fail);
});
document.getElementById('today').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
render();init();
</script>
